<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JQ Xiao</title>
    <style>
      :root {
        color: #151515;
        background: #f8f8f6;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
      }

      #fluid {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        text-align: center;
      }

      .hero {
        width: min(760px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(54px, 13vw, 132px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: rgba(20, 20, 20, 0.64);
        font-size: clamp(18px, 2.2vw, 22px);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border: 1px solid rgba(20, 20, 20, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.42);
        color: #151515;
        text-decoration: none;
        font-weight: 700;
        backdrop-filter: blur(18px);
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        border-color: rgba(20, 20, 20, 0.22);
        background: rgba(255, 255, 255, 0.66);
      }

      .watermark {
        position: fixed;
        left: 50%;
        bottom: -0.18em;
        z-index: 0;
        transform: translateX(-50%);
        font-size: clamp(96px, 22vw, 260px);
        line-height: 0.8;
        font-weight: 900;
        color: transparent;
        background: linear-gradient(
          180deg,
          rgba(20, 20, 20, 0.09),
          rgba(20, 20, 20, 0)
        );
        background-clip: text;
        -webkit-background-clip: text;
        user-select: none;
        pointer-events: none;
        white-space: nowrap;
      }

      @media (max-width: 520px) {
        main {
          align-items: start;
          padding-top: 96px;
        }

        .actions {
          width: 100%;
        }

        a {
          flex: 1 1 150px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fluid" aria-hidden="true"></canvas>
    <div class="watermark">JQ Xiao</div>

    <main>
      <section class="hero" aria-label="Introduction">
        <h1>Hello, Xiao!</h1>
        <div class="actions">
          <a href="#">GitHub</a>
          <a href="#">Repository</a>
        </div>
      </section>
    </main>

    <script src="./fluid.js"></script>
  </body>
</html>
