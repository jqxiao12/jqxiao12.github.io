<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JQ Xiao</title>
    <style>
      :root {
        color: #151515;
        background: #f8f8f6;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
      }

      #fluid {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        text-align: center;
      }

      .hero {
        width: min(760px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(54px, 13vw, 132px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: rgba(20, 20, 20, 0.64);
        font-size: clamp(18px, 2.2vw, 22px);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border: 1px solid rgba(20, 20, 20, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.42);
        color: #151515;
        text-decoration: none;
        font-weight: 700;
        backdrop-filter: blur(18px);
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        border-color: rgba(20, 20, 20, 0.22);
        background: rgba(255, 255, 255, 0.66);
      }

      .watermark {
        position: fixed;
        left: 50%;
        bottom: -0.18em;
        z-index: 0;
        transform: translateX(-50%);
        font-size: clamp(96px, 22vw, 260px);
        line-height: 0.8;
        font-weight: 900;
        color: transparent;
        background: linear-gradient(
          180deg,
          rgba(20, 20, 20, 0.09),
          rgba(20, 20, 20, 0)
        );
        background-clip: text;
        -webkit-background-clip: text;
        user-select: none;
        pointer-events: none;
        white-space: nowrap;
      }

      @media (max-width: 520px) {
        main {
          align-items: start;
          padding-top: 96px;
        }

        .actions {
          width: 100%;
        }

        a {
          flex: 1 1 150px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fluid" aria-hidden="true"></canvas>
    <div class="watermark">JQ Xiao</div>

    <main>
      <section class="hero" aria-label="Introduction">
        <h1>Hello, world!</h1>
        <div class="actions">
          <a href="https://github.com/jqxiao12">GitHub</a>
          <a href="https://github.com/jqxiao12/jqxiao12.github.io">Repository</a>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("fluid");
        const ctx = canvas.getContext("2d", { alpha: true });
        const simCanvas = document.createElement("canvas");
        const simCtx = simCanvas.getContext("2d", { alpha: true });
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const state = {
          width: 0,
          height: 0,
          cols: 0,
          rows: 0,
          count: 0,
          pointer: {
            x: 0,
            y: 0,
            px: 0,
            py: 0,
            down: false,
            initialized: false,
          },
          lastTime: performance.now(),
          hue: Math.random(),
        };

        let u;
        let v;
        let uNext;
        let vNext;
        let r;
        let g;
        let b;
        let rNext;
        let gNext;
        let bNext;
        let divergence;
        let pressure;
        let pressureNext;
        let pixels;

        const cfg = {
          cellSize: 9,
          maxCols: 150,
          velocityDissipation: 0.985,
          dyeDissipation: 0.993,
          pressure: 0.82,
          pressureIterations: 14,
          splatRadius: 0.075,
          splatForce: 52,
          colorPower: 1.45,
          grayRemoval: 0.86,
        };

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          const width = Math.max(1, innerWidth);
          const height = Math.max(1, innerHeight);
          const oldCols = state.cols;
          const oldRows = state.rows;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const cols = Math.min(cfg.maxCols, Math.ceil(width / cfg.cellSize));
          const rows = Math.ceil((height / width) * cols);
          state.width = width;
          state.height = height;
          state.cols = Math.max(36, cols);
          state.rows = Math.max(36, rows);
          state.count = state.cols * state.rows;

          simCanvas.width = state.cols;
          simCanvas.height = state.rows;
          pixels = simCtx.createImageData(state.cols, state.rows);

          const old = { r, g, b };
          allocate();

          if (old.r) {
            for (let y = 0; y < state.rows; y += 1) {
              for (let x = 0; x < state.cols; x += 1) {
                const i = idx(x, y);
                const ox = Math.min(oldCols - 1, Math.floor((x / state.cols) * oldCols));
                const oy = Math.min(oldRows - 1, Math.floor((y / state.rows) * oldRows));
                const oi = oy * oldCols + ox;
                r[i] = old.r[oi] || 0;
                g[i] = old.g[oi] || 0;
                b[i] = old.b[oi] || 0;
              }
            }
          }
        }

        function allocate() {
          const n = state.count;
          u = new Float32Array(n);
          v = new Float32Array(n);
          uNext = new Float32Array(n);
          vNext = new Float32Array(n);
          r = new Float32Array(n);
          g = new Float32Array(n);
          b = new Float32Array(n);
          rNext = new Float32Array(n);
          gNext = new Float32Array(n);
          bNext = new Float32Array(n);
          divergence = new Float32Array(n);
          pressure = new Float32Array(n);
          pressureNext = new Float32Array(n);
        }

        function idx(x, y) {
          x = Math.max(0, Math.min(state.cols - 1, x));
          y = Math.max(0, Math.min(state.rows - 1, y));
          return y * state.cols + x;
        }

        function sample(field, x, y) {
          x = Math.max(0, Math.min(state.cols - 1.001, x));
          y = Math.max(0, Math.min(state.rows - 1.001, y));
          const x0 = Math.floor(x);
          const y0 = Math.floor(y);
          const x1 = Math.min(state.cols - 1, x0 + 1);
          const y1 = Math.min(state.rows - 1, y0 + 1);
          const sx = x - x0;
          const sy = y - y0;
          const a = field[idx(x0, y0)];
          const c = field[idx(x0, y1)];
          return (
            a * (1 - sx) * (1 - sy) +
            field[idx(x1, y0)] * sx * (1 - sy) +
            c * (1 - sx) * sy +
            field[idx(x1, y1)] * sx * sy
          );
        }

        function hsvToRgb(h, s, value) {
          const i = Math.floor(h * 6);
          const f = h * 6 - i;
          const p = value * (1 - s);
          const q = value * (1 - f * s);
          const t = value * (1 - (1 - f) * s);
          switch (i % 6) {
            case 0:
              return [value, t, p];
            case 1:
              return [q, value, p];
            case 2:
              return [p, value, t];
            case 3:
              return [p, q, value];
            case 4:
              return [t, p, value];
            default:
              return [value, p, q];
          }
        }

        function splat(x, y, dx, dy, strong = false) {
          const cx = (x / state.width) * state.cols;
          const cy = (y / state.height) * state.rows;
          const radius = Math.max(5, Math.min(state.cols, state.rows) * cfg.splatRadius);
          const radiusSq = radius * radius;
          state.hue = (state.hue + 0.018) % 1;
          const color = hsvToRgb(state.hue, 0.92, strong ? 1.75 : cfg.colorPower);
          const force = strong ? cfg.splatForce * 1.4 : cfg.splatForce;

          for (let yy = Math.floor(cy - radius); yy <= Math.ceil(cy + radius); yy += 1) {
            for (let xx = Math.floor(cx - radius); xx <= Math.ceil(cx + radius); xx += 1) {
              if (xx < 0 || yy < 0 || xx >= state.cols || yy >= state.rows) continue;
              const ox = xx - cx;
              const oy = yy - cy;
              const dist = ox * ox + oy * oy;
              if (dist > radiusSq) continue;
              const falloff = Math.exp(-dist / (radiusSq * 0.38));
              const i = idx(xx, yy);
              u[i] += dx * force * falloff;
              v[i] += dy * force * falloff;
              r[i] += color[0] * falloff;
              g[i] += color[1] * falloff;
              b[i] += color[2] * falloff;
            }
          }
        }

        function advect(source, target, dt, dissipation) {
          for (let y = 0; y < state.rows; y += 1) {
            for (let x = 0; x < state.cols; x += 1) {
              const i = idx(x, y);
              const backX = x - u[i] * dt;
              const backY = y - v[i] * dt;
              target[i] = sample(source, backX, backY) * dissipation;
            }
          }
        }

        function project() {
          for (let y = 0; y < state.rows; y += 1) {
            for (let x = 0; x < state.cols; x += 1) {
              const i = idx(x, y);
              divergence[i] =
                (u[idx(x + 1, y)] - u[idx(x - 1, y)] + v[idx(x, y + 1)] - v[idx(x, y - 1)]) *
                -0.5;
              pressure[i] = 0;
            }
          }

          for (let k = 0; k < cfg.pressureIterations; k += 1) {
            for (let y = 0; y < state.rows; y += 1) {
              for (let x = 0; x < state.cols; x += 1) {
                pressureNext[idx(x, y)] =
                  (divergence[idx(x, y)] +
                    pressure[idx(x - 1, y)] +
                    pressure[idx(x + 1, y)] +
                    pressure[idx(x, y - 1)] +
                    pressure[idx(x, y + 1)]) *
                  0.25 *
                  cfg.pressure;
              }
            }
            [pressure, pressureNext] = [pressureNext, pressure];
          }

          for (let y = 0; y < state.rows; y += 1) {
            for (let x = 0; x < state.cols; x += 1) {
              const i = idx(x, y);
              u[i] -= (pressure[idx(x + 1, y)] - pressure[idx(x - 1, y)]) * 0.5;
              v[i] -= (pressure[idx(x, y + 1)] - pressure[idx(x, y - 1)]) * 0.5;
            }
          }
        }

        function step(dt) {
          advect(u, uNext, dt, cfg.velocityDissipation);
          advect(v, vNext, dt, cfg.velocityDissipation);
          [u, uNext] = [uNext, u];
          [v, vNext] = [vNext, v];
          project();
          advect(r, rNext, dt, cfg.dyeDissipation);
          advect(g, gNext, dt, cfg.dyeDissipation);
          advect(b, bNext, dt, cfg.dyeDissipation);
          [r, rNext] = [rNext, r];
          [g, gNext] = [gNext, g];
          [b, bNext] = [bNext, b];
        }

        function render() {
          const data = pixels.data;
          for (let i = 0; i < state.count; i += 1) {
            const p = i * 4;
            const gray = Math.min(r[i], g[i], b[i]) * cfg.grayRemoval;
            const rr = Math.max(0, r[i] - gray);
            const gg = Math.max(0, g[i] - gray);
            const bb = Math.max(0, b[i] - gray);
            const strength = Math.max(0.001, rr + gg + bb);
            const tone = Math.min(1.35, Math.pow(strength, 0.62));
            const cr = Math.min(255, (rr / strength) * tone * 360);
            const cg = Math.min(255, (gg / strength) * tone * 360);
            const cb = Math.min(255, (bb / strength) * tone * 360);
            const maxChannel = Math.max(cr, cg, cb);
            const minChannel = Math.min(cr, cg, cb);
            const saturation = maxChannel === 0 ? 0 : (maxChannel - minChannel) / maxChannel;
            const alpha = Math.min(235, maxChannel * 1.15 * Math.min(1, saturation * 2.35));
            data[p] = cr;
            data[p + 1] = cg;
            data[p + 2] = cb;
            data[p + 3] = alpha;
          }

          simCtx.putImageData(pixels, 0, 0);
          ctx.clearRect(0, 0, state.width, state.height);
          ctx.save();
          ctx.filter = "blur(7px) saturate(1.75) contrast(1.08)";
          ctx.globalCompositeOperation = "source-over";
          ctx.drawImage(simCanvas, 0, 0, state.width, state.height);
          ctx.restore();
        }

        function animate(now) {
          const dt = Math.min(0.016, (now - state.lastTime) / 1000) * 52;
          state.lastTime = now;

          if (!reducedMotion.matches) {
            step(dt);
            render();
            requestAnimationFrame(animate);
          }
        }

        function move(x, y) {
          const pointer = state.pointer;
          if (!pointer.initialized) {
            pointer.x = x;
            pointer.y = y;
            pointer.px = x;
            pointer.py = y;
            pointer.initialized = true;
          }

          const dx = (x - pointer.x) / Math.max(1, state.width);
          const dy = (y - pointer.y) / Math.max(1, state.height);
          pointer.px = pointer.x;
          pointer.py = pointer.y;
          pointer.x = x;
          pointer.y = y;

          if (Math.abs(dx) + Math.abs(dy) > 0.0002) {
            splat(x, y, dx, dy, pointer.down);
          }
        }

        addEventListener("resize", resize, { passive: true });
        addEventListener(
          "pointermove",
          (event) => move(event.clientX, event.clientY),
          { passive: true },
        );
        addEventListener(
          "pointerdown",
          (event) => {
            state.pointer.down = true;
            move(event.clientX, event.clientY);
            splat(event.clientX, event.clientY, 0.02, -0.02, true);
          },
          { passive: true },
        );
        addEventListener("pointerup", () => {
          state.pointer.down = false;
        });

        resize();

        for (let i = 0; i < 7; i += 1) {
          const x = state.width * (0.2 + Math.random() * 0.6);
          const y = state.height * (0.24 + Math.random() * 0.34);
          splat(x, y, Math.random() * 0.03 - 0.015, Math.random() * 0.03 - 0.015, true);
        }

        if (!reducedMotion.matches) {
          requestAnimationFrame(animate);
        }
      })();
    </script>
  </body>
</html>
